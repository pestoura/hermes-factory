  version: 1.1.0
  lifecycle: superseded
  superseded_by: policies/hermes-upstream-reconciliation-v1.2.yaml
  authoritative_for_current_platform_reconciliation: false
  architecture_baseline: 1.1
  implementation_authority: NOT_GRANTED

  historical_baseline:
