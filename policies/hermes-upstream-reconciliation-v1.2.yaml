schema: hermes.factory/platform-reconciliation-policy/v1.2
policy:
  id: hermes-upstream-reconciliation
  version: 1.2.0
  lifecycle: proposed_for_owner_review
  architecture_baseline: 1.2
  implementation_authority: NOT_GRANTED

  fork:
    repository: pestoura/hermes-agent
  upstream:
    repository: NousResearch/hermes-agent

  production_tracking:
    moving_upstream_branch_allowed: false
    accepted_exact_sha_required: true
    blind_update: forbidden

  required_stages:
    - detect_upstream_release_or_selected_commit
    - create_reconciliation_candidate
    - classify_upstream_vs_fork_delta
    - preserve_local_security_and_governance_hardening
    - run_upstream_tests
    - run_fork_regression_tests
    - run_dispatch_approval_parity_tests
    - run_auto_decompose_containment_tests
    - run_profile_kanban_compatibility_tests
    - bind_candidate_with_exact_sha_gate
    - stage_runtime_smoke
    - record_accepted_platform_baseline

  preserved_hardening:
    - dispatch_approval_fail_closed_semantics
    - structured_approval_transition_parity
    - auto_decompose_containment
    - exact_candidate_identity

  fail_closed_conditions:
    - unresolved_hardening_conflict
    - failed_or_not_run_required_test
    - candidate_identity_unknown
    - containment_regression
    - dispatch_approval_regression

  authority:
    automatic_production_promotion: false
    owner_or_governance_gate_required: true

  invariants:
    - not_run_is_not_pass
    - moving_upstream_main_is_not_an_accepted_baseline
    - accepted_platform_baseline_is_exact_sha_bound
    - local_hardening_must_not_be_silently_lost
