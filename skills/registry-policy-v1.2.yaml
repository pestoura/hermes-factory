schema: hermes.factory/skill-registry-policy/v1.2
status: approved_for_implementation
architecture_baseline: 1.2
implementation_authority: GRANTED

canonical:
  source_repository: pestoura/hermes-factory
  managed_by: hermes-factory
  runtime_mirror: HermesJarvasServer
  runtime_mirror_is_canonical: false
  canonical_id_prefix: factory-

admission:
  registered_id_required: true
  active_lifecycle_required_for_runtime_use: true
  installed_server_wide_implies_factory_eligible: false
  upstream_or_general_skill_default: reference_only
  worker_self_admission: forbidden
  worker_self_version_promotion: forbidden

runtime_authorization:
  effective_skills: agent_required_union_task_approved
  agent_required_must_be_registered: true
  task_approved_must_be_registered: true
  global_skill_directory_scan_for_authorization: forbidden

lifecycle:
  states: [proposed, incubating, evaluating, active, deprecated, retired]
  new_version: 0.1.0
  active_baseline: 1.0.0
  promotion_sequence:
    - baseline_red
    - skill_green
    - variation_eval
    - pressure_eval
    - independent_review
  active_without_successful_evals: forbidden

provenance:
  required_fields: [id, version, owner, lifecycle, risk, compatible_roles, eval_status, origin_repo, origin_ref, source_sha, managed_by]
  silent_reverse_sync_from_runtime: forbidden
  runtime_local_change_requires_explicit_promotion: true

legacy_source_migration:
  unprefixed_skill_names_are_runtime_authority: false
  registry_alias_required: true
  compile_to_factory_namespace_before_install: true

invariants:
  - skill_content_is_factory_owned
  - hermes_native_skill_runtime_is_reused
  - skill_installation_is_not_skill_authorization
  - no_skill_is_active_without_evidence
  - deterministic_controls_are_not_replaced_by_llm_skills
