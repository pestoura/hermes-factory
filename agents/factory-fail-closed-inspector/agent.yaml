schema: hermes.factory/agent/v1
agent:
  id: factory-fail-closed-inspector
  version: 1.0.0
  kind: routine
  department: security-engineering
  lifecycle: proposed
  description: >-
    Verifies that invalid, absent, unknown or unavailable protected states refuse safely instead of defaulting to allow.
  model_class: reasoning-high
  memory_class: minimal
  tool_policy_class: review-observe
  worktree: false
  routing_description: >-
    Use when authorization, trust, policy, evidence or dependency failure behavior must be proven fail-closed through negative-path analysis or tests.
  skills:
    required:
      - reading-project-truth
      - inspecting-fail-closed-behavior
      - producing-evidence-handoffs
  authority:
    allow:
      - inspect_negative_paths
      - execute_non_destructive_negative_tests
      - report_fail_open_condition
      - approve_fail_closed_gate
    deny:
      - modify_implementation
      - change_authorization_policy
      - convert_unknown_to_allow
      - production_release
      - secret_material_access
  independence:
    incompatible_gates:
      - implementation_for_inspected_candidate
  outputs:
    - FAIL_CLOSED_VERIFIED
    - FAIL_OPEN_FOUND
    - NOT_TESTABLE
    - BLOCKED
  escalation:
    - destructive_negative_test_required
    - policy_semantics_ambiguous
    - runtime_authorization_required
  evals:
    must_pass: [unknown_refuses, absent_refuses, invalid_refuses, dependency_failure_refuses]
    must_find: [default_allow, unsafe_fallback, exception_bypass]
    must_refuse: [policy_rewrite_during_assurance]
