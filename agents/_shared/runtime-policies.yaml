schema: hermes.factory/runtime-policies/v1.2
status: approved_for_implementation
architecture_baseline: 1.2
implementation_authority: GRANTED

profile_authority_decision:
  REFUSE: the requested operation itself is explicitly prohibited
  SEPARATE: the bounded work may continue with prohibited responsibility assigned to a distinct authorized actor
  BLOCKED: the bounded work cannot continue because required authority or evidence is absent
  separation_of_duties_precedence: SEPARATE_over_REFUSE_for_delegable_responsibility_conflict

model_classes:
  reasoning-high:
    intent: complex architecture, security, governance and orchestration reasoning
    selection: factory-model-policy
  reasoning-standard:
    intent: structured analysis, documentation, evidence and operational reasoning
    selection: factory-model-policy
  coding-high:
    intent: complex code/test authoring and repository reasoning
    selection: factory-model-policy
  coding-standard:
    intent: test/integration implementation with moderate coding complexity
    selection: factory-model-policy
  fast-verifier:
    intent: deterministic or narrow verification with low creativity requirement
    selection: factory-model-policy

memory_classes:
  minimal:
    persistent_professional_memory: false
    project_memory: false
    rationale: assurance identity should minimize contamination from previous candidates
  professional:
    persistent_professional_memory: true
    project_memory: false
    canonical_override: forbidden
  professional+project:
    persistent_professional_memory: true
    project_memory: true
    project_memory_source: external-context-or-rehydrated-project
    canonical_override: forbidden

# Internal Factory workers use supported local/native Hermes/Jarvas interfaces.
# The Hermes MCP Bridge is reserved for the northbound external control boundary
# and is not the normal IPC path between Factory Profiles and Jarvas services.
native_surfaces:
  factory-semantic-read:
    authority: read
    purpose: local Factory project, work, agent, gate, evidence and traceability inspection
  factory-semantic-orchestrate:
    authority: bounded-work-mutation
    purpose: local governed create/link/assign/rework/pause transitions over native Factory/Kanban adapters
  hermes-kanban-read:
    authority: read
    purpose: native Hermes board/task/dependency/dispatch state
  hermes-kanban-orchestrate:
    authority: bounded-work-mutation
    purpose: native Hermes task creation/linking/assignment/promotion under structured policy
  scm-read:
    authority: read
    purpose: repository, issue, PR, commit, review and CI inspection through supported Git/GitHub interfaces
  scm-engineering-write:
    authority: bounded-scm-write
    purpose: branch, commit, PR and review workflow inside assigned repositories
  runtime-read:
    authority: read
    purpose: fresh runtime observation only
  release-controlled:
    authority: protected-mutation
    purpose: release/promotion/rollback operations only through policy and true HITL when required

external_control_boundary:
  transport: Hermes_MCP_Bridge
  direction: northbound_only
  clients: [ChatGPT_Governor, external_authorized_clients]
  internal_worker_dependency: forbidden

# Tool policies are desired enforcement contracts. SOUL instructions are not
# considered enforcement. The Agent Compiler must translate these to Hermes
# platform toolsets, native/local adapters, sandbox/workspace mode and credential policy.
# Factory Skills are preloaded only from governed Profile/task pins. The Hermes
# `skills` discovery toolset is intentionally not exposed to Factory workers,
# because worker_self_expansion is forbidden.
tool_policy_classes:
  control-orchestrate:
    hermes_toolsets: [todo, kanban]
    local: [factory-semantic-read, factory-semantic-orchestrate, hermes-kanban-read, hermes-kanban-orchestrate, scm-read]
    mcp: []
    workspace: none
    terminal: disabled
    browser: disabled
    scm_write: false
    runtime_write: false

  control-read:
    hermes_toolsets: [todo, kanban]
    local: [factory-semantic-read, hermes-kanban-read, scm-read]
    mcp: []
    workspace: none
    terminal: disabled
    browser: disabled
    scm_write: false
    runtime_write: false

  engineering-readwrite-docs:
    hermes_toolsets: [terminal, file, web, todo, kanban]
    local: [factory-semantic-read, hermes-kanban-read, scm-read, scm-engineering-write]
    mcp: []
    workspace: isolated-worktree
    terminal: sandboxed-preferred
    scm_write: bounded
    runtime_write: false

  design-docs:
    hermes_toolsets: [file, web, vision, todo, kanban]
    local: [factory-semantic-read, hermes-kanban-read, scm-read, scm-engineering-write]
    mcp: []
    workspace: isolated-worktree
    terminal: disabled-by-default
    scm_write: bounded-docs-only
    runtime_write: false

  engineering-worktree:
    hermes_toolsets: [terminal, file, web, todo, kanban]
    local: [factory-semantic-read, hermes-kanban-read, scm-read, scm-engineering-write]
    mcp: []
    workspace: isolated-worktree
    terminal: sandboxed-preferred
    scm_write: bounded
    runtime_write: false

  review:
    hermes_toolsets: [terminal, file, web, todo, kanban]
    local: [factory-semantic-read, hermes-kanban-read, scm-read]
    mcp: []
    workspace: read-only-candidate-snapshot
    terminal: sandboxed-readonly-candidate
    scm_write: review-comments-only-through-supported-scm-interface
    runtime_write: false

  review-observe:
    hermes_toolsets: [terminal, file, todo, kanban]
    local: [factory-semantic-read, hermes-kanban-read, scm-read]
    mcp: []
    workspace: read-only-candidate-snapshot
    terminal: sandboxed-readonly-candidate
    scm_write: false
    runtime_write: false

  engineering-test:
    hermes_toolsets: [terminal, file, todo, kanban]
    local: [factory-semantic-read, hermes-kanban-read, scm-read, scm-engineering-write]
    mcp: []
    workspace: isolated-test-worktree
    terminal: sandboxed-preferred
    scm_write: tests-only-bounded
    runtime_write: false

  runtime-observe:
    hermes_toolsets: [todo, kanban]
    local: [factory-semantic-read, hermes-kanban-read, scm-read, runtime-read]
    mcp: []
    workspace: none
    terminal: disabled
    scm_write: false
    runtime_write: false

  release-controlled:
    hermes_toolsets: [todo, kanban]
    local: [factory-semantic-read, hermes-kanban-read, scm-read, release-controlled]
    mcp: []
    workspace: none
    terminal: disabled-by-default
    scm_write: false
    runtime_write: policy-gated

hermes_profile_defaults:
  home_mode: profile
  secrets_in_distribution: forbidden
  memories_in_distribution: forbidden
  sessions_in_distribution: forbidden
  runtime_state_in_distribution: forbidden
  profile_per_concurrent_agent: required
  shared_profile_between_processes: forbidden
  worktree_for_repo_mutation: required
  time_driven_schedule: native_hermes_profile_cron_only

skill_authorization:
  rule: effective_skills_equals_required_plus_task_approved
  required_skills_must_be_registered: true
  task_approved_skills_must_be_registered: true
  server_wide_install_implies_factory_authorization: false
  worker_self_expansion: forbidden

transition_authorization:
  ordinary_stage_transition: structured_machine_or_policy_authorization
  structured_approval_implies_human: false
  true_hitl: explicit_hitl_request_required
  handoff_must_be_atomic: true

policy_invariants:
  - soul_is_not_authority_enforcement
  - profile_is_not_a_sandbox
  - least_privilege_tools
  - credentials_scoped_outside_agent_dna
  - reviewer_candidate_workspace_read_only_where_practical
  - runtime_observer_no_mutation_tools
  - release_mutation_only_via_policy_or_explicit_hitl
  - project_specific_tools_do_not_silently_expand_global_agent_authority
  - internal_factory_workers_do_not_depend_on_mcp_bridge
  - structured_approval_does_not_mean_human_approval
  - native_hermes_cron_only_for_factory_time_driven_work
