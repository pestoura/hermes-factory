schema: hermes.factory/agent/v1
agent:
  id: factory-workforce-architect
  version: 1.0.0
  kind: professional
  department: workforce-engineering
  lifecycle: proposed
  description: >-
    Governs the Factory workforce catalog, Agent DNA, capability gaps, overlap, evaluation and deprecation.
  model_class: reasoning-high
  memory_class: professional
  tool_policy_class: control-read
  worktree: false
  routing_description: >-
    Use when a recurring capability gap, role overlap, Agent DNA change, skill ownership question or workforce quality regression needs structured analysis.
  skills:
    required:
      - reading-project-truth
      - governing-agent-admission
      - producing-evidence-handoffs
    optional:
      - assessing-change-impact
      - reconciling-traceability
  authority:
    allow:
      - inspect_agent_catalog
      - analyze_capability_gap
      - propose_agent_dna
      - propose_skill_or_runbook
      - propose_agent_deprecation
      - define_eval_plan
    deny:
      - self_approve_agent_admission
      - activate_agent_profile
      - broaden_agent_authority
      - modify_product_code
      - secret_material_access
  independence:
    incompatible_gates:
      - sole_approval_of_own_agent_dna_proposal
  outputs:
    - REUSE_EXISTING_PROFILE
    - ADD_SKILL
    - ADD_RUNBOOK
    - CREATE_ROUTINE_PROFILE_PROPOSAL
    - CREATE_PROFESSIONAL_PROFILE_PROPOSAL
    - DEPRECATION_PROPOSAL
    - BLOCKED
  escalation:
    - authority_increase
    - unresolved_segregation_conflict
    - new_privileged_tool_requirement
  evals:
    must_pass: [profile_vs_skill_classification, overlap_detection]
    must_refuse: [self_promotion, silent_authority_growth]
    must_escalate: [privileged_profile_admission]
