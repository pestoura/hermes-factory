name: Factory CI

on:
  push:
    branches:
      - implementation/factory-runtime-v1.2
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/hermes_factory
      - name: Pytest
        run: pytest -q

  static-profile-evals:
    needs: test
    runs-on: ubuntu-latest
    env:
      FACTORY_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Build exact-head static Profile eval evidence
        run: |
          python -m hermes_factory.governance.static_profile_bundle \
            --repo-root . \
            --output-dir artifacts/static-profile-evals \
            --candidate-sha "$FACTORY_CANDIDATE_SHA"
      - name: Upload static Profile eval evidence
        uses: actions/upload-artifact@v4
        with:
          name: static-profile-evals-${{ env.FACTORY_CANDIDATE_SHA }}
          path: |
            artifacts/static-profile-evals/static-profile-evals.json
            artifacts/static-profile-evals/static-profile-evals.db
            artifacts/static-profile-evals/behavioral-eval-plan.json
          if-no-files-found: error

  factory-skill-catalog-candidate:
    needs: test
    runs-on: ubuntu-latest
    env:
      FACTORY_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FACTORY_CANDIDATE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Build exact-head Factory Skill catalog candidate
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          from hermes_factory.runtime.skill_catalog_candidate import (
              build_skill_catalog_candidate,
          )

          registry = yaml.safe_load(
              Path("skills/registry.yaml").read_text(encoding="utf-8")
          )
          if not isinstance(registry, dict):
              raise SystemExit("skills/registry.yaml must contain a mapping")

          build_skill_catalog_candidate(
              source_root=Path("skills"),
              registry_document=registry,
              candidate_sha=os.environ["FACTORY_CANDIDATE_SHA"],
              output_root=Path("artifacts/factory-skill-catalog"),
          )
          PY
      - name: Upload exact-head Factory Skill catalog candidate
        uses: actions/upload-artifact@v4
        with:
          name: factory-skill-catalog-candidate-${{ env.FACTORY_CANDIDATE_SHA }}
          path: artifacts/factory-skill-catalog
          if-no-files-found: error

  factory-package-candidate:
    needs: test
    runs-on: ubuntu-latest
    env:
      FACTORY_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact-head Factory wheel
        run: |
          mkdir -p artifacts/factory-package
          python -m pip wheel . --no-deps --wheel-dir artifacts/factory-package
      - name: Verify exact-head Factory wheel installation
        run: python -m pip install artifacts/factory-package/*.whl
      - name: Build exact-head Factory package identity
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from hermes_factory.runtime.package_candidate import build_package_candidate_manifest

          package_dir = Path("artifacts/factory-package")
          wheels = sorted(package_dir.glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one Factory wheel, found {len(wheels)}")
          build_package_candidate_manifest(
              wheel_path=wheels[0],
              candidate_sha=os.environ["FACTORY_CANDIDATE_SHA"],
              output_path=package_dir / "factory-package.json",
          )
          PY
      - name: Upload exact-head Factory package candidate
        uses: actions/upload-artifact@v4
        with:
          name: factory-package-candidate-${{ env.FACTORY_CANDIDATE_SHA }}
          path: |
            artifacts/factory-package/*.whl
            artifacts/factory-package/factory-package.json
          if-no-files-found: error
