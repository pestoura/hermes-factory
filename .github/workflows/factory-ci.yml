name: Factory CI

on:
  push:
    branches:
      - implementation/factory-runtime-v1.2
  pull_request:

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - name: Runner smoke
        run: echo runner-ok

  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout smoke
        run: test -f pyproject.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python smoke
        run: python --version

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[dev]'
