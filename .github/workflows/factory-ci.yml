name: Factory CI

on:
  push:
    branches:
      - implementation/factory-runtime-v1.2
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/hermes_factory
      - name: Pytest
        run: pytest -q

  static-profile-evals:
    needs: test
    runs-on: ubuntu-latest
    env:
      FACTORY_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Build exact-head static Profile eval evidence
        run: |
          python -m hermes_factory.governance.static_profile_bundle \
            --repo-root . \
            --output-dir artifacts/static-profile-evals \
            --candidate-sha "$FACTORY_CANDIDATE_SHA"
      - name: Upload static Profile eval evidence
        uses: actions/upload-artifact@v4
        with:
          name: static-profile-evals-${{ env.FACTORY_CANDIDATE_SHA }}
          path: |
            artifacts/static-profile-evals/static-profile-evals.json
            artifacts/static-profile-evals/static-profile-evals.db
            artifacts/static-profile-evals/behavioral-eval-plan.json
          if-no-files-found: error
